  draw();
  onValue(ref(fbDb, 'logs'), (snapshot) => {
    logs = snapshot.val() || {};
    lput();
    note = '🟢 Đã đồng bộ đám mây (tự động cập nhật giữa các thiết bị)';
    if (S.sel == null) draw();
  }, (err) => {
    note = '🔴 Lỗi kết nối Firebase (' + err.message + ') - Đang lưu tạm trên máy này';
    draw();
  });
}

async function save(id, d){
  const k = id + '_' + d.ym;
  logs[k] = d;
  lput();
  try {
    await set(ref(fbDb, 'logs/' + k), d);
    return true;
  } catch (e) {
    alert('Không lưu được lên đám mây: ' + (e.message || e.code));
    return false;
  }
}

function draw(){S.sel==null?(S.tab=='m'?home():hist()):form()}
function head(){return `<h1>Checklist bảo trì thiết bị</h1>${note?`<div class="m" style="margin-bottom:6px">${E(note)}</div>`:''}<div class="row tabs"><button class="${S.tab=='m'?'on':''}" onclick="S.tab='m';draw()">Đợt tháng</button><button class="${S.tab=='h'?'on':''}" onclick="S.tab='h';draw()">Nhật ký</button></div>
<div class="row" style="margin-top:8px"><label style="margin:0">Tháng</label><input type="month" value="${S.ym}" onchange="S.ym=this.value||S.ym;draw()"></div>`}

function home(){
 const A=[...new Set(D.map(d=>d[1]))],n=D.length,c={Đạt:0,Theo:0,Không:0,Đang:0,Chưa:0};D.forEach(d=>{const s=st(d[0]).split(' ')[0];c[s]=(c[s]||0)+1});
 const done=c.Đạt+c.Theo+c.Không,mins=D.filter(d=>st(d[0])=='Chưa').reduce((a,d)=>a+(d[5]||0),0);
 const lst=D.filter(d=>(!S.area||d[1]==S.area)&&(!S.todo||!['Đạt','Theo dõi','Không đạt'].includes(st(d[0])))&&(!S.q||(d[0]+d[1]+d[2]+d[3]).toLowerCase().includes(S.q.toLowerCase())));
 const m=mo(S.ym),ex=m%6==0?'Hàng tháng + chu kỳ 3 và 6 tháng':m%3==0?'Hàng tháng + chu kỳ 3 tháng':'Hàng tháng';
 $('#app').innerHTML=head()+`<div class="card"><div class="row"><b class="g">${done}/${n} thiết bị đã kiểm tra</b><span>${Math.round(done/n*100)}%</span></div><div class="bar"><i style="width:${done/n*100}%"></i></div>
<div class="m" style="margin-top:6px">Nội dung đợt: ${ex} · Đạt ${c.Đạt} · Theo dõi ${c.Theo} · Không đạt ${c.Không} · Đang làm ${c.Đang} · Chưa ${c.Chưa} · còn ~${mins} phút</div></div>
<div class="row"><input id="q" class="g" type="text" placeholder="Tìm thiết bị, mã, bể…" value="${E(S.q)}" oninput="S.q=this.value;list()"><select onchange="S.area=this.value;draw()"><option value="">Tất cả khu vực</option>${A.map(a=>`<option ${a==S.area?'selected':''}>${E(a)}</option>`).join('')}</select></div>
<label style="display:flex;gap:6px;align-items:center;font-size:14px;color:var(--fg)"><input type="checkbox" ${S.todo?'checked':''} onchange="S.todo=this.checked;draw()">Chỉ hiện thiết bị chưa xong</label><div id="ls"></div>`;
 window._l=lst;list()}

function list(){const q=S.q.toLowerCase(),x=window._l.filter(d=>!q||(d[0]+d[1]+d[2]+d[3]).toLowerCase().includes(q));
 $('#ls').innerHTML=x.map(d=>{const s=st(d[0]);return `<div class="card" onclick="open_('${d[0]}')"><div class="row"><div class="g"><b>${E(d[2])}${d[3]?' ('+E(d[3])+')':''}</b><div class="m">${d[0]} · ${E(d[1])}</div></div><span class="b s-${s.split(' ')[0]}">${s}</span></div></div>`}).join('')||'<p class="m">Không có thiết bị phù hợp.</p>'}

function open_(id){S.sel=id;const k=id+'_'+S.ym,d=D.find(x=>x[0]==id);S.cur=JSON.parse(JSON.stringify(logs[k]||{ym:S.ym,id,date:today(),it:{},by:localStorage.getItem('who')||'',before:[],after:[],mins:d[5]||'',bad:'',parts:'',res:'Chưa'}));if(!S.cur.it)S.cur.it={};if(!S.cur.before)S.cur.before=[];if(!S.cur.after)S.cur.after=[];form();scrollTo(0,0)}

function form(){const d=D.find(x=>x[0]==S.sel),c=S.cur,its=items(d,mo(S.ym));
 $('#app').innerHTML=`<button onclick="S.sel=null;draw()">← Danh sách</button><div class="card"><b>${E(d[2])}${d[3]?' ('+E(d[3])+')':''}</b><div class="m">${d[0]} · ${E(d[1])} · Nhân lực: ${E(d[6])} · Dự kiến ${d[5]} phút</div></div>
<div class="card"><div class="row"><b class="g">Hạng mục tháng ${mo(S.ym)}/${S.ym.slice(0,4)}</b><button onclick="allok()">Đạt tất cả</button></div>${its.map((x,i)=>`<div class="it"><div>${i+1}. ${E(x[1])}</div><div class="m">${x[0]} · Đạt khi: ${E(x[3])}${x[2]>1?' · chu kỳ '+x[2]+' tháng':''}</div><div class="ch">${[['ok','✓ Đạt'],['ng','✗ Lỗi'],['na','NA']].map(([k,t])=>`<button class="${k} ${c.it[x[1]]==k?'on':''}" onclick="mark(${i},'${k}')">${t}</button>`).join('')}</div></div>`).join('')}</div>
<div class="card"><b>Hình ảnh</b>${ph('before','Trước khi thực hiện')}${ph('after','Sau khi thực hiện')}<div id="msg" class="m"></div></div>
<div class="card"><label>Ngày thực hiện</label><input type="date" value="${c.date}" onchange="S.cur.date=this.value"><label>Người thực hiện</label><input type="text" value="${E(c.by)}" onchange="S.cur.by=this.value"><label>Thời gian thực tế (phút)</label><input type="number" value="${E(c.mins)}" onchange="S.cur.mins=this.value">
<label>Bất thường phát hiện</label><textarea rows="2" onchange="S.cur.bad=this.value">${E(c.bad)}</textarea><label>Phụ tùng / vật tư thay thế</label><textarea rows="2" onchange="S.cur.parts=this.value">${E(c.parts)}</textarea>
<label>Kết quả</label><select onchange="S.cur.force=this.value"><option value="">Tự động theo checklist</option>${['Đạt','Theo dõi','Không đạt'].map(v=>`<option ${c.force==v?'selected':''}>${v}</option>`).join('')}</select></div>
<div class="fix"><div class="in"><button onclick="S.sel=null;draw()">Hủy</button><button class="pri" onclick="fin()">Lưu</button></div></div>`}

function mark(i,k){const d=D.find(x=>x[0]==S.sel),n=items(d,mo(S.ym))[i][1];S.cur.it[n]=S.cur.it[n]==k?'':k;form()}
function allok(){const d=D.find(x=>x[0]==S.sel);items(d,mo(S.ym)).forEach(x=>{if(!S.cur.it[x[1]])S.cur.it[x[1]]='ok'});form()}

async function fin(){const d=D.find(x=>x[0]==S.sel),its=items(d,mo(S.ym)),v=its.map(x=>S.cur.it[x[1]]||''),c=S.cur;
 c.res=c.force||(v.includes('ng')?'Không đạt':v.every(Boolean)?'Đạt':v.some(Boolean)?'Đang làm':'Chưa');
 if(c.res=='Chưa'&&!c.force&&!c.bad){alert('Chưa đánh dấu hạng mục nào.');return}
 if(c.by)localStorage.setItem('who',c.by);c.name=d[2]+(d[3]?' ('+d[3]+')':'');c.area=d[1];c.ts=Date.now();
 const p=JSON.parse(JSON.stringify(c,(k,v)=>k=='tmp'?undefined:v));
 if(await save(S.sel,p)){S.sel=null;draw()}}

function hist(){const x=Object.values(logs).filter(l=>l.ym==S.ym).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
 $('#app').innerHTML=head()+`<div class="row" style="margin-top:8px"><span class="g m">${x.length} bản ghi trong tháng</span><button onclick="csv()">Tải CSV (tất cả)</button></div>`+(x.map(l=>`<div class="card" onclick="open_('${l.id}')"><div class="row"><div class="g"><b>${E(l.name)}</b><div class="m">${l.id} · ${E(l.area)} · ${l.date} · ${l.by} · ${l.mins} phút</div>${(l.before||[]).length+(l.after||[]).length?`<div class="m">📷 Trước ${(l.before||[]).length} · Sau ${(l.after||[]).length}</div>`:''}${l.bad?`<div class="m">Bất thường: ${E(l.bad)}</div>`:''}${l.parts?`<div class="m">Vật tư: ${E(l.parts)}</div>`:''}</div><span class="b s-${l.res.split(' ')[0]}">${l.res}</span></div></div>`).join('')||'<p class="m">Chưa có bản ghi.</p>')}

const rs=f=>new Promise((ok,no)=>{const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const s=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);ok(c.toDataURL('image/jpeg',.65))};i.onerror=()=>no(new Error('Không đọc được ảnh'));i.src=u});

function ph(k,t){const a=S.cur[k]||[];return `<label>${t}</label><div class="row">${a.map((p,i)=>`<span style="position:relative"><a href="${E(p.url)}" target="_blank" rel="noopener"><img src="${E(p.tmp||p.url)}" style="width:78px;height:78px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)"></a><button onclick="delp('${k}',${i})" style="position:absolute;top:-6px;right:-6px;padding:0 7px;border-radius:12px">×</button></span>`).join('')}<label style="margin:0;display:inline-block;border:1px dashed var(--bd);border-radius:8px;padding:26px 14px;cursor:pointer;color:var(--fg)">📷 Chụp / chọn ảnh<input type="file" accept="image/*" multiple hidden onchange="addp('${k}',this)"></label></div>`}

async function addp(k,el){const fs=[...el.files];el.value='';for(const f of fs){try{const b=$('#msg');if(b)b.textContent='Đang xử lý ảnh…';const url=await rs(f);(S.cur[k]=S.cur[k]||[]).push({id:Date.now()+'_'+Math.random().toString(36).slice(2,6),url})}catch(e){alert('Không xử lý được ảnh: '+(e.message||e.code))}}form()}
function delp(k,i){S.cur[k].splice(i,1);form()}

function csv(){
 const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
 const r=[['Tháng','Ngày','Mã phiếu','Khu vực','Thiết bị','Kết quả','Bất thường','Vật tư','Phút','Người thực hiện'].map(q).join(',')];
 Object.values(logs).sort((a,b)=>(a.ym+a.id).localeCompare(b.ym+b.id)).forEach(l=>r.push([l.ym,l.date,l.id,l.area,l.name,l.res,l.bad,l.parts,l.mins,l.by].map(q).join(',')));
 const blob = new Blob(['\ufeff' + r.join('\n')], { type: 'text/csv;charset=utf-8;' });
 const a = document.createElement('a');
 a.href = URL.createObjectURL(blob);
 a.download = 'nhat-ky-bao-tri.csv';
 a.click();
}

Object.assign(window, { S, draw, list, open_, mark, allok, fin, addp, delp, csv });

init();
</script></body></html>
